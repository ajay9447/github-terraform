name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - github-terraform
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ajay9447-terraform-state-062502181286
  TF_IN_AUTOMATION: true
  TF_INPUT: false

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::062502181286:role/github@S3access
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform

      - name: Bootstrap Terraform state bucket
        shell: bash
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/github-terraform'
        run: terraform apply -input=false -auto-approve